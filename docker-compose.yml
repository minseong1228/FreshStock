# Keep the existing Docker project and volume when the folder name changes.
name: bentostock
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: bentostock
      POSTGRES_USER: bento
      POSTGRES_PASSWORD: bento
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bento -d bentostock"]
      interval: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://bento:bento@db:5432/bentostock
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
  web:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [api]
volumes:
  pgdata:
